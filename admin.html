<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCC NITAR — Global Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
    :root { --teal: #004d40; --army: #2d3436; --accent: #00bfa5; --bg: #f0f2f5; --card: #ffffff; --border: #d0ddd8; }
    body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; }
    #login-screen { position: fixed; inset: 0; background: #0d1117; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #login-screen.out { display: none; }
    .login-box { background: white; padding: 40px; border-top: 5px solid var(--accent); width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    #app { display: none; min-height: 100vh; flex-direction: row; }
    #app.visible { display: flex; }
    .sidebar { width: 250px; background: var(--army); color: white; padding: 20px; }
    .main-area { flex: 1; padding: 30px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: white; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 4px 4px 0 var(--army); }
    input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
    .btn { padding: 10px 20px; cursor: pointer; border: none; background: var(--teal); color: white; font-family: 'Oswald'; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: var(--army); color: white; padding: 15px; border-left: 5px solid var(--accent); display: none; z-index: 10000; }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="font-family:'Oswald';">ADMIN ACCESS</h2>
        <input type="text" id="inp-id" placeholder="Admin ID">
        <input type="password" id="inp-pwd" placeholder="Password">
        <button class="btn" onclick="doLogin()">AUTHENTICATE</button>
        <p id="login-err" style="color:red; font-size:0.8rem;"></p>
    </div>
</div>

<div id="app">
    <aside class="sidebar">
        <h3 style="color:var(--accent);">COMMANDER</h3>
        <p onclick="gotoPanel('dashboard')" style="cursor:pointer;">📊 Dashboard</p>
        <p onclick="gotoPanel('notices')" style="cursor:pointer;">📋 Notices</p>
        <p onclick="gotoPanel('rank')" style="cursor:pointer;">🏅 Rank Panel</p>
        <p onclick="gotoPanel('gallery')" style="cursor:pointer;">🖼 Gallery</p>
        <p onclick="gotoPanel('officers')" style="cursor:pointer;">🪖 Officers</p>
        <br>
        <button class="btn" onclick="location.reload()" style="background:#c0392b; width:100%;">LOGOUT</button>
    </aside>

    <main class="main-area">
        <div id="panel-dashboard" class="panel active">
            <h2 style="font-family:'Oswald';">DASHBOARD</h2>
            <div id="stats-grid" style="display:flex; gap:20px;"></div>
        </div>

        <div id="panel-notices" class="panel">
            <div class="card">
                <h3>+ Post Notice</h3>
                <input type="text" id="not-title" placeholder="Notice Title">
                <textarea id="not-body" placeholder="Notice Content"></textarea>
                <input type="text" id="not-by" placeholder="Posted By (e.g. SUO)">
                <button class="btn" onclick="addNotice()">BROADCAST GLOBALLY</button>
            </div>
            <div id="notices-list"></div>
        </div>

        <div id="panel-rank" class="panel">
            <div class="card">
                <h3>+ Add Cadet</h3>
                <input type="text" id="rank-rank" placeholder="Rank (e.g. SUO)">
                <input type="text" id="rank-name" placeholder="Full Name">
                <input type="text" id="rank-branch" placeholder="Branch">
                <button class="btn" onclick="addRankEntry()">ADD TO PANEL</button>
            </div>
            <table style="width:100%; background:white; border-collapse:collapse;" border="1"><tbody id="rank-tbody"></tbody></table>
        </div>

        <div id="panel-gallery" class="panel">
            <div class="card">
                <h3>+ Add Gallery Event</h3>
                <input type="text" id="gal-folder" placeholder="Folder Name (exact)">
                <button class="btn" style="background:var(--accent);" onclick="fetchFolderIndex()">1. FETCH FILES</button>
                <input type="hidden" id="gal-files-hidden">
                <input type="text" id="gal-title" placeholder="Event Title">
                <input type="text" id="gal-thumb" placeholder="Thumbnail Path (e.g. photo.jpg)">
                <button class="btn" onclick="addGalleryItem()">2. ADD EVENT</button>
            </div>
            <div id="gallery-list"></div>
        </div>
        
        <div id="panel-officers" class="panel">
            <div class="card">
                <h3>+ Add Officer</h3>
                <input type="text" id="off-name" placeholder="Full Name">
                <input type="text" id="off-role" placeholder="Role (CO/AO/ANO)">
                <input type="text" id="off-designation" placeholder="Full Designation">
                <input type="text" id="off-photo" placeholder="Photo Path">
                <textarea id="off-bio" placeholder="Biography"></textarea>
                <button class="btn" onclick="addOfficer()">SAVE OFFICER</button>
            </div>
            <div id="officers-list"></div>
        </div>
    </main>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBCLCGsYWA-PUhWvgW45cb-X9G1CjrtAcs",
        authDomain: "ncc-nit-ap.firebaseapp.com",
        projectId: "ncc-nit-ap",
        databaseURL: "https://ncc-nit-ap-default-rtdb.asia-southeast1.firebasedatabase.app/",
        appId: "1:311443142169:web:b274a34fb95fedd6465c88"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.save = async (key, data) => {
        try {
            await set(ref(db, 'ncc_unit/' + key), data);
            toast(`Cloud Updated: ${key} ✓`);
        } catch (e) { toast("Error: " + e.message, true); }
    };

    onValue(ref(db, 'ncc_unit'), (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            localStorage.setItem('ncc_gallery', JSON.stringify(data.gallery || []));
            localStorage.setItem('ncc_officers', JSON.stringify(data.officers || []));
            localStorage.setItem('ncc_rank', JSON.stringify(data.rank || []));
            localStorage.setItem('ncc_notices', JSON.stringify(data.notices || []));
            renderAll();
        }
    });

    window.doLogin = function() {
        const id = document.getElementById('inp-id').value, pwd = document.getElementById('inp-pwd').value;
        if(id === 'nccaradmin' && pwd === 'NITAR@NCC2026') {
            document.getElementById('login-screen').classList.add('out');
            document.getElementById('app').classList.add('visible');
            renderAll();
        } else { document.getElementById('login-err').textContent = "✕ Invalid Credentials"; }
    };

    window.gotoPanel = function(name) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + name).classList.add('active');
    };

    window.addNotice = function() {
        const data = JSON.parse(localStorage.getItem('ncc_notices') || '[]');
        data.push({ title: v('not-title'), body: v('not-body'), by: v('not-by'), created: new Date().toISOString() });
        save('notices', data);
    };

    window.addRankEntry = function() {
        const data = JSON.parse(localStorage.getItem('ncc_rank') || '[]');
        data.push({ rank: v('rank-rank'), name: v('rank-name'), branch: v('rank-branch') });
        save('rank', data);
    };

    window.addOfficer = function() {
        const data = JSON.parse(localStorage.getItem('ncc_officers') || '[]');
        data.push({ name: v('off-name'), role: v('off-role'), designation: v('off-designation'), photo: v('off-photo'), bio: v('off-bio') });
        save('officers', data);
    };

    window.fetchFolderIndex = async function() {
        const folder = v('gal-folder');
        const url = `https://akhand-jaihind.github.io/ncc-nit-ap/${encodeURIComponent(folder)}/index.json`;
        try {
            const r = await fetch(url);
            const files = await r.json();
            document.getElementById('gal-files-hidden').value = JSON.stringify(files);
            toast("Fetched " + files.length + " files!");
        } catch(e) { toast("Error: Check if index.json exists on GitHub", true); }
    };

    window.addGalleryItem = function() {
        const data = JSON.parse(localStorage.getItem('ncc_gallery') || '[]');
        data.push({ title: v('gal-title'), folder: v('gal-folder'), thumb: v('gal-thumb'), files: JSON.parse(document.getElementById('gal-files-hidden').value || '[]') });
        save('gallery', data);
    };

    window.deleteItem = function(key, idx) {
        if(!confirm('Delete?')) return;
        const data = JSON.parse(localStorage.getItem('ncc_' + key) || '[]');
        data.splice(idx, 1);
        save(key, data);
    };

    function renderAll() {
        const n = JSON.parse(localStorage.getItem('ncc_notices') || '[]');
        const r = JSON.parse(localStorage.getItem('ncc_rank') || '[]');
        const o = JSON.parse(localStorage.getItem('ncc_officers') || '[]');
        const g = JSON.parse(localStorage.getItem('ncc_gallery') || '[]');
        
        document.getElementById('stats-grid').innerHTML = `<div class="card"><b>${n.length}</b><br>Notices</div><div class="card"><b>${r.length}</b><br>Cadets</div>`;
        document.getElementById('notices-list').innerHTML = n.map((x, i) => `<div class="card">${x.title} <button onclick="deleteItem('notices',${i})">✕</button></div>`).join('');
        document.getElementById('rank-tbody').innerHTML = r.map((x, i) => `<tr><td>${x.name}</td><td><button onclick="deleteItem('rank',${i})">✕</button></td></tr>`).join('');
        document.getElementById('officers-list').innerHTML = o.map((x, i) => `<div class="card">${x.name} <button onclick="deleteItem('officers',${i})">✕</button></div>`).join('');
        document.getElementById('gallery-list').innerHTML = g.map((x, i) => `<div class="card">${x.title} <button onclick="deleteItem('gallery',${i})">✕</button></div>`).join('');
    }

    const v = (id) => document.getElementById(id).value.trim();
    function toast(m, err) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; t.style.background = err ? '#c0392b' : '#2d3436'; setTimeout(() => t.style.display = 'none', 3000); }
</script>
</body>
</html>
