<script type="module">
    // 1. Import Global Firebase Cloud Modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    // 2. Global Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBCLCGsYWA-PUhWvgW45cb-X9G1CjrtAcs",
        authDomain: "ncc-nit-ap.firebaseapp.com",
        projectId: "ncc-nit-ap",
        storageBucket: "ncc-nit-ap.firebasestorage.app",
        databaseURL: "https://ncc-nit-ap-default-rtdb.asia-southeast1.firebasedatabase.app/",
        appId: "1:311443142169:web:b274a34fb95fedd6465c88"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /* ═══════════════ GLOBAL LISTENER ═══════════════ */
    // This watches the Singapore Cloud 24/7 and updates the site instantly
    onValue(ref(db, 'ncc_unit'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('live-badge').classList.add('show');
            
            // Dynamics: Update sections using your original UI rendering logic
            if(data.gallery)   renderGalleryUI(data.gallery);
            if(data.officers)  renderOfficersUI(data.officers);
            if(data.rank)      renderRankUI(data.rank);
            if(data.notices)   renderNoticesUI(data.notices);
            if(data.resources) renderResourcesUI(data.resources);
            
            // Restore Animations: Re-trigger ScrollReveal on new elements
            setTimeout(initReveal, 200);
        }
    });

    /* ═══════════════ RENDERING LOGIC ═══════════════ */
    function renderGalleryUI(ev) {
        const c = document.getElementById('gallery-cards');
        c.innerHTML = ev.map((e, i) => `
            <figure class="techy-gallery-item reveal" style="animation-delay:${i*0.08}s"
                    onclick="openGallery(this)" data-folder="${he(e.folder)}" data-title="${he(e.title)}"
                    data-files='${JSON.stringify(e.files||[])}'>
                <div class="card-overlay"><span class="card-overlay-icon">▶ View Gallery</span></div>
                <img src="${he(e.thumb)}" onerror="this.src='LOGO_SOCIAL MEDIA.png'">
                <figcaption>${he(e.label||e.title)}</figcaption>
            </figure>`).join('');
        document.getElementById('stat-events').textContent = ev.length;
    }

    function renderOfficersUI(off) {
        const stack = document.getElementById('officers-stack');
        stack.innerHTML = off.map(o => `
            <div class="officer-card reveal">
                <div class="officer-rank-badge">${he(o.role)}</div>
                <div class="officer-photo-wrap">
                    <img src="${he(o.photo)}" class="officer-photo" onerror="this.parentElement.classList.add('no-photo')">
                    <div class="officer-photo-frame"></div>
                </div>
                <div class="officer-info">
                    <p class="officer-designation">${he(o.designation)}</p>
                    <h3 class="officer-name">${he(o.name)}</h3>
                    <div class="officer-divider"></div>
                    <p class="officer-bio">${he(o.bio)}</p>
                </div>
            </div>`).join('');
    }

    function renderRankUI(cadets) {
        const c = document.getElementById('rank-container');
        c.innerHTML = `<table class="rank-table reveal">
            <thead><tr><th>Rank</th><th>Name of Cadet</th><th>Branch</th></tr></thead>
            <tbody>${cadets.map(r => `<tr>
                <td><strong style="font-family:'Oswald';">${he(r.rank)}</strong></td>
                <td>${he(r.name)}</td>
                <td>${he(r.branch)}</td>
            </tr>`).join('')}</tbody></table>`;
        document.getElementById('stat-cadets').textContent = cadets.length;
    }

    function renderNoticesUI(notices) {
        const active = notices.filter(n => !n.expiry || new Date(n.expiry) >= new Date());
        document.getElementById('stat-notices').textContent = active.length;
        document.getElementById('notices-ticker').innerHTML = active.map(n => `<span class="notice-tick-item">● ${he(n.title)}</span>`).join('');
        document.getElementById('notices-bar').style.display = active.length ? 'flex' : 'none';

        document.getElementById('notices-list').innerHTML = [...active].reverse().map(n => `
            <div class="notice-card reveal">
                <div class="notice-card-title">${he(n.title)}</div>
                <p class="notice-card-text">${he(n.body)}</p>
                <small>By: ${he(n.by || 'Admin')}</small>
            </div>`).join('');
    }

    function renderResourcesUI(res) {
        document.getElementById('resources-grid').innerHTML = res.map(r => `
            <div class="resource-card reveal">
                <div class="resource-icon">📄</div>
                <div class="resource-info">
                    <div class="resource-title">${he(r.title)}</div>
                    <a class="resource-dl" href="${he(r.fileUrl)}" target="_blank">↓ Download</a>
                </div>
            </div>`).join('');
        document.getElementById('stat-resources').textContent = res.length;
    }

    /* ═══════════════ RE-ATTACH DYNAMICS ═══════════════ */
    // Functions must be attached to 'window' to work with HTML 'onclick' buttons
    window.openTab = function(name, btn) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        if (btn) btn.classList.add('active');
        setTimeout(initReveal, 100);
    };

    let mediaList = []; let currentIdx = 0;
    window.openGallery = function(card) {
        const files = JSON.parse(card.dataset.files || '[]');
        const folder = card.dataset.folder;
        mediaList = files.map(f => ({ src: `${folder}/${f}`, name: f }));
        document.getElementById('lb-title-text').textContent = card.dataset.title;
        document.getElementById('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
        showMedia(0);
    };

    function showMedia(idx) {
        currentIdx = idx;
        const m = mediaList[idx];
        const wrap = document.getElementById('lb-media-wrap');
        const isVid = m.src.toLowerCase().endsWith('.mp4');
        wrap.innerHTML = isVid ? `<video controls autoplay><source src="${m.src}"></video>` : `<img src="${m.src}" loading="lazy">`;
        document.getElementById('lb-counter').textContent = `${idx + 1} / ${mediaList.length}`;
    }

    window.navigate = (dir) => { let n = currentIdx + dir; if (n >= 0 && n < mediaList.length) showMedia(n); };
    window.closeLightbox = () => { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; };

    /* ═══════════════ RESTORE ANIMATIONS ═══════════════ */
    function initReveal() {
        const obs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal:not(.in)').forEach(el => obs.observe(el));
    }

    // Loader logic
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }, 2000);
    });

    function he(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
